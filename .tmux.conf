# Set prefix
set-option -g prefix C-a

# 0 is too far from ` ;)
set -g base-index 1

# start pane numbering at 1
set -g pane-base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# tmux-256color rather than screen-256color: it advertises capabilities screen's
# terminfo does not, italics being the visible one. $TERM propagates over ssh, so
# hosts without this terminfo entry may need it installed.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

setw -g mode-keys vi
setw -g monitor-activity on

# Both stated explicitly rather than left to defaults. tmux 3.6 ships
# history-limit 2000 and escape-time 10, and tmux-sensible would raise the former
# to 50000 while leaving the latter alone.
set -g history-limit 10000
set -sg escape-time 0

bind R refresh-client

bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Reload tmux config
bind r source-file ~/.tmux.conf

# Panes
set -g pane-border-style fg=colour8,bg=default
set -g pane-active-border-style fg=colour10,bg=default

# Status bar
set -g message-style fg=colour0,bg=colour11
set -g message-command-style fg=colour0,bg=colour11
set -g status-bg 'colour8'
set -g status-justify 'left'
set -g status-left-length '100'
set -g status 'on'
set -g status-right-length '100'
setw -g window-status-style fg=colour7,bg=colour10
setw -g window-status-activity-style fg=colour4,bg=colour10
setw -g window-status-separator ''
set -g status-left '#[fg=colour0,bg=colour4] #S #[fg=colour4,bg=colour8,nobold,nounderscore,noitalics]'
set -g status-right '#[fg=colour10,bg=colour8,nobold,nounderscore,noitalics]#[fg=colour0,bg=colour10] %Y-%m-%d  %H:%M #[fg=colour4,bg=colour10,nobold,nounderscore,noitalics]#[fg=colour0,bg=colour4] #h '
setw -g window-status-format '#[fg=colour7,bg=colour8] #I#F #[fg=colour7,bg=colour8] #W'
setw -g window-status-current-format '#[fg=colour8,bg=colour11,nobold,nounderscore,noitalics]#[fg=colour0,bg=colour11] #I#F #[fg=colour0,bg=colour11] #W #[fg=colour11,bg=colour8,nobold,nounderscore,noitalics]'

# Set window notifications
set -g visual-activity on

# Mouse support - set to on if you want to use the mouse
set -g mouse on

# Let notifications and progress upgrades reach the outer terminal.
set -g allow-passthrough on

# Distinguish shift+enter from enter to make it easier to edit multi-line prompts
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g @plugin 'tmux-plugins/tmux-sensible'

# Bootstrap TPM on a machine that does not have it yet, so a fresh clone needs no
# manual step. Fires once, guarded by the directory check.
#
# Verified: the clone completes, but install_plugins does not finish before the
# `run` line below executes, so on a brand new machine the plugins are not active
# until the config is reloaded (prefix + r) or prefix + I is pressed. Subsequent
# starts are fine.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# tmux-sensible force-sets status-keys to emacs, unguarded, so this has to come
# after it runs. Only affects the prefix-: command prompt; copy-mode uses
# mode-keys, which sensible leaves alone.
set -g status-keys vi
