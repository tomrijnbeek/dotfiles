# ============================================================================
# Core behaviour
# ============================================================================
set-option -g prefix C-a

# Match the keyboard: 0 is too far from `.
set -g base-index 1
set -g pane-base-index 1

# Keep window names as set, rather than following the running command. Names given
# with `prefix ,` then survive.
set-window-option -g automatic-rename off
set-option -g set-titles on

# No activity tracking: the window list shows no activity icon, and `visual-activity off`
# would ring the terminal bell rather than stay quiet -- off means "bell, not message".
setw -g monitor-activity off

setw -g mode-keys vi
set -g mouse on
set -g detach-on-destroy off

# Both stated explicitly rather than left to defaults. tmux 3.6 ships
# history-limit 2000 and escape-time 10, and tmux-sensible would raise the former
# to 50000 while leaving the latter alone.
set -g history-limit 10000
set -sg escape-time 0

# ============================================================================
# Terminal capabilities
# ============================================================================
# tmux-256color rather than screen-256color: it advertises capabilities screen's
# terminfo does not, italics being the visible one. $TERM propagates over ssh, so
# hosts without this terminfo entry may need it installed.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Distinguish shift+enter from enter to make it easier to edit multi-line prompts
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Let notifications and progress updates reach the outer terminal.
set -g allow-passthrough on

# ============================================================================
# Key bindings
# ============================================================================
bind r source-file ~/.tmux.conf
bind R refresh-client

bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-vim and Alt-arrow switch panes without the prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Ctrl-Shift arrow to switch sessions. Plain Ctrl-arrow is taken by macOS Spaces
# and Alt-Shift is too close to the Alt-arrow pane bindings, where a stray Shift
# would jump session and redraw everything.
bind -n C-S-Left  switch-client -p
bind -n C-S-Right switch-client -n

# Cycling does not scale past a handful of sessions, so Ctrl-Shift-Up picks one
# by name instead.
bind -n C-S-Up display-popup -E -w 40% -h 40% \
  "tmux list-sessions -F '#{session_name}' \
   | grep -vx \"$(tmux display-message -p '#S')\" \
   | fzf --reverse --no-info \
   | xargs -r tmux switch-client -t"

# ============================================================================
# Palette
# ============================================================================
# Three tiers, deepest first: the bar, then the windows and git branch, then the session
# and clock. Colours are fixed values, but each is derived from the terminal scheme
# (currently iTerm2 "oxide") by a rule, so matching another scheme is a re-derivation
# rather than a guess. Mixes are needed because a scheme's neutrals jump from near-black
# to mid grey with nothing usable between; three tiers cannot be had from the palette
# alone. Referencing the ANSI slots directly instead would break: slot 8 is a mid grey
# here but a dark teal in others, so light-on-slot-8 measures 2.05:1 in one scheme and
# 5.14:1 in another.
#
#   bar-bg        colour0                        tier 1: the bar, and inactive tabs
#   bar-raised    colour0 -> colour8 at 16%      tier 2: git block, menu selections
#   bar-chrome    colour0 -> colour8 at 34%      tier 3: session and clock blocks
#   bar-active    bar-raised -> colour4 at 25%   the active tab
#   bar-text      colour7                        text on every tier
#   bar-mid       colour8                        message fill, divider ink, active border
#   bar-accent    colour4                        session and clock icons, copy-mode match
#   bar-alert     colour1                        the session icon while the prefix is armed
#   bar-on-light  the terminal background        text on mid, alert and accent fills
set -g @bar-bg "#262626"
set -g @bar-raised "#373737"
set -g @bar-chrome "#4a4a4a"
set -g @bar-active "#385366"
set -g @bar-text "#cecece"
set -g @bar-mid "#8f8f8f"
set -g @bar-accent "#3ba6f5"
set -g @bar-alert "#ed756e"
set -g @bar-on-light "#161616"

# Git's brand orange, deliberately not derived from the scheme: a brand colour should not
# change when the terminal theme does.
set -g @bar-git "#f05032"

# ============================================================================
# Panes
# ============================================================================
set -g pane-border-style "fg=#{@bar-chrome}"
set -g pane-active-border-style "fg=#{@bar-mid}"

# ============================================================================
# Status bar
# ============================================================================
# status-bg and status-fg are legacy options that still OVERRIDE status-style when tmux
# paints the bar, so a server that ever had them set keeps drawing with them however
# status-style changes. Deleting the line does not unset it; `set -gu status-bg` does.
set -g status-style "bg=#{@bar-bg},fg=#{@bar-text}"

set -g status-position top
set -g status-left-length 100
set -g status-right-length 100

setw -g window-status-style "fg=#{@bar-text},bg=#{@bar-bg}"
setw -g window-status-current-style "fg=#{@bar-text},bg=#{@bar-active}"

# tmux defaults this to `reverse`, which inverts the whole block into a light slab the
# moment a bell fires, and Claude Code rings one on completion.
setw -g window-status-bell-style "fg=#{@bar-alert},bg=#{@bar-bg}"

set -g @window-icon-div "#[fg=#{@bar-mid}]#[default] "
set -g @window-flags "#{?window_zoomed_flag, ,}#{?window_bell_flag, ,}#{?window_marked_flag, ,}"

# The style is re-asserted after #{session_dots} because the plugin closes with #[default].
set -g status-left '#[fg=#{@bar-text},bg=#{@bar-chrome}] #[fg=#{?client_prefix,#{@bar-alert},#{@bar-accent}}]#[fg=#{@bar-text}] #S #{session_dots}#[fg=#{@bar-text},bg=#{@bar-chrome}] '

# The branch shells out once per status-interval; sed drops the icon and spacing with the
# name when git outputs nothing, leaving an empty tier-2 block outside a repo.
set -g status-right '#[fg=#{@bar-raised},bg=#{@bar-bg}]#[bg=#{@bar-raised}]#(cd "#{pane_current_path}" && git branch --show-current 2>/dev/null | sed "s|^.*|#[fg=#{@bar-git}]  #[fg=#{@bar-text}]&|") #[fg=#{@bar-chrome},bg=#{@bar-raised}]#[bg=#{@bar-chrome}]#[fg=#{@bar-accent}] #[fg=#{@bar-text}] %a %d %b  %H:%M '

# Each window contributes one leading and one trailing cell whatever its state, so nothing
# reflows when the selection moves. The transition glyph lives in the separator so it
# always falls in the same column, and is dropped where it would abut the active tab,
# whose own slant forms the join there. A separator's bg must be its neighbour's colour,
# never the bar's: these glyphs fill half a cell, so a bar-coloured bg leaves a wedge.
setw -g window-status-separator "#[fg=#{?#{||:#{window_active},#{==:#{e|+:#{window_index},1},#{active_window_index}}},#{@bar-active},#{@bar-mid}},bg=#{@bar-bg}]#{?window_active,,#{?#{==:#{e|+:#{window_index},1},#{active_window_index}},,}}"
setw -g window-status-format '#[fg=#{?window_start_flag,#{@bar-chrome},#{@bar-bg}},bg=#{@bar-bg}]#{?window_start_flag,,}#[default] #I #{E:@window-icon-div}#W#{E:@window-flags} #[fg=#{@bar-bg},bg=#{@bar-bg}] '
setw -g window-status-current-format '#[fg=#{@bar-active},bg=#{?window_start_flag,#{@bar-chrome},#{@bar-active}}]#{?window_start_flag,,}#[default] #I  #W#{E:@window-flags} #[fg=#{@bar-active},bg=#{?window_end_flag,#{@bar-bg},#{@bar-active}}]#{?window_end_flag,, }'

# ============================================================================
# Messages, modes and menus
# ============================================================================
# Filling the whole line makes a prompt unmissable; a neutral keeps it from shouting.
set -g message-style "fg=#{@bar-on-light},bg=#{@bar-mid}"
set -g message-command-style "fg=#{@bar-on-light},bg=#{@bar-mid}"
set -g message-format '#[fill=#{@bar-mid} fg=#{@bar-on-light}]#{message}'

# Selections in choose-tree, menus and copy mode all default to yellow otherwise.
set -g mode-style "fg=#{@bar-text},bg=#{@bar-raised},bold"
set -g menu-style "fg=#{@bar-text},bg=#{@bar-bg}"
set -g menu-selected-style "fg=#{@bar-text},bg=#{@bar-raised},bold"
set -g menu-border-style "fg=#{@bar-raised}"
set -g copy-mode-match-style "fg=#{@bar-on-light},bg=#{@bar-mid}"
set -g copy-mode-current-match-style "fg=#{@bar-on-light},bg=#{@bar-accent}"

# ============================================================================
# Plugins
# ============================================================================
set -g @plugin 'tmux-plugins/tmux-sensible'

# Renders #{session_dots} in status-left. Its default colour is Catppuccin pink, which has
# nothing to do with this palette.
set -g @plugin 'jtmcginty/tmux-session-dots'
set -g @session-dots-color "#{@bar-text}"

# Bootstrap TPM on a machine that does not have it yet, so a fresh clone needs no manual
# step. Fires once, guarded by the directory check. The clone completes, but
# install_plugins does not finish before the `run` below executes, so on a brand new
# machine the plugins are inactive until the config is reloaded or `prefix + I` is pressed.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# tmux-sensible force-sets status-keys to emacs, unguarded, so this has to come after it
# runs. Only affects the prefix-: command prompt; copy-mode uses mode-keys, which sensible
# leaves alone.
set -g status-keys vi
